# Run `pre-commit install` once to enable these hooks locally.
# See https://pre-commit.com.
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Mirror the CI 1 MiB limit (maxkb is in KiB).
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: check-links
        name: check relative Markdown links
        entry: python3 .github/scripts/check_links.py
        language: system
        files: \.md$
        # The checker walks every tracked file itself.
        pass_filenames: false
