# Run `pre-commit install` once to enable these hooks locally.
# See https://pre-commit.com.
repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Mirror the CI 1 MiB limit (maxkb is in KiB).
      - id: check-added-large-files
        args: [--maxkb=1024]
  # Only reaches code: addlicense has no comment syntax for Markdown, so entries
  # carry their CC-BY-SA-4.0 claim in README.md and LICENSE instead.
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        args:
          - -c
          - Open Reaction Database Project Authors
          - -l
          - apache
  - repo: local
    hooks:
      - id: check-links
        name: check relative Markdown links
        entry: python3 .github/scripts/check_links.py
        language: system
        files: \.md$
        # The checkers walk every tracked file themselves.
        pass_filenames: false
      - id: check-metadata
        name: check entry metadata
        entry: python3 .github/scripts/check_metadata.py
        language: system
        files: ^entries/.*\.md$
        pass_filenames: false
