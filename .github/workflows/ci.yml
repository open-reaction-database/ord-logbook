name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links
        run: python3 .github/scripts/check_links.py

  file-size:
    runs-on: ubuntu-latest
    env:
      # Maximum size for any tracked file. Keep large or binary artifacts out of
      # the repo and link to them instead.
      MAX_BYTES: 1048576 # 1 MiB
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked file sizes
        run: |
          status=0
          while IFS= read -r file; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "::error file=$file::$file is $size bytes (limit $MAX_BYTES)"
              status=1
            fi
          done < <(git ls-files)
          if [ "$status" -ne 0 ]; then
            echo "One or more files exceed the $MAX_BYTES-byte limit."
          fi
          exit $status
